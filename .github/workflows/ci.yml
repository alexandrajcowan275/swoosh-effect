name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Full offline test suite
        run: python -m pytest -q
      - name: Pre-commit secret and canonical URL scans
        run: pre-commit run --all-files
      - name: Scan complete Git history
        shell: bash
        run: |
          scanner=$(find "$HOME/.cache/pre-commit" -type f -path '*/bin/gitleaks' -print -quit)
          test -n "$scanner"
          "$scanner" git . --log-opts="--all --full-history" --redact=100 --ignore-gitleaks-allow

  site:
    name: Static story and number ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci --include=dev
      - name: Reconcile committed site data and README number ledger
        run: npm run check-data
      - name: Build static export and validate every displayed number
        run: npm run build
      - name: Check types and rendered mutation regressions
        run: npm run typecheck && npm test
