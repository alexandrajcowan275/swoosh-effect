name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Full offline test suite
        run: python -m pytest -q
      - name: Pre-commit secret and canonical URL scans
        run: pre-commit run --all-files
      - name: Scan complete Git history
        shell: bash
        run: |
          scanner=$(find "$HOME/.cache/pre-commit" -type f -path '*/bin/gitleaks' -print -quit)
          test -n "$scanner"
          "$scanner" git . --log-opts="--all --full-history" --redact=100 --ignore-gitleaks-allow
