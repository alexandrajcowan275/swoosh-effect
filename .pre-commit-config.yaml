repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--ignore-gitleaks-allow]
  - repo: local
    hooks:
      - id: canonical-source-urls
        name: Reject signed and tokenized URLs in the Git index
        entry: python scripts/check_public_urls.py --staged
        language: python
        pass_filenames: false
        always_run: true
